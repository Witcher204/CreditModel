<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Risk Predictor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="panel">
        <div class="panel-header">
          <p class="eyebrow">Credit model</p>
          <h1>Проверка риска дефолта</h1>
        </div>

        <p class="note">
          Модель оценивает вероятность дефолта по 6 параметрам. Результат — <strong>0</strong>
          (без дефолта) или <strong>1</strong> (дефолт).
        </p>

        <form id="loan-form" class="form-grid">
          <label>
            <span>Месячный доход</span>
            <input type="number" step="0.01" name="mothly_income" value="6500" required />
          </label>

          <label>
            <span>Ежемесячные платежи по долгу</span>
            <input type="number" step="0.01" name="monthly_debt_payments" value="900" required />
          </label>

          <label>
            <span>DTI ratio</span>
            <input type="number" step="0.01" name="dti_ratio" value="22.4" required />
          </label>

          <label>
            <span>Просрочки за 12 месяцев</span>
            <input type="number" min="0" step="1" name="late_payments_12m" value="1" required />
          </label>

          <label>
            <span>Сумма кредита</span>
            <input type="number" step="0.01" name="loan_amount" value="25000" required />
          </label>

          <label>
            <span>Срок кредита (месяцы)</span>
            <input type="number" min="1" step="1" name="loan_term_months" value="36" required />
          </label>

          <button type="submit">Проверить</button>
        </form>

        <div id="result" class="result hidden" aria-live="polite">
          <h2>Результат</h2>
          <p id="result-text"></p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
